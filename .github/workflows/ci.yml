name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests (with Race Detector)
        run: go test -v -race ./...

      - name: Build Binary
        run: go build ./cmd/skrun

      - name: Doctor Check
        run: ./skrun doctor

